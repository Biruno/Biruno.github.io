    { section: "Player Stats", title: "Gamer & Creator", enemies: ["bug", "spitter", "spitter", "sleeper", "brute", "brute"],

/* =========================== ENGINE (no need to edit) =========================== */
const C = CONFIG, W = 800, H = 500, WL = 48, PR = 13;
const SANS = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif', MONO = 'ui-monospace,"Courier New",monospace';
const $ = id => document.getElementById(id);
const RES = Math.min(3, Math.max(2, Math.ceil(window.devicePixelRatio || 1)));  // render resolution multiplier (sharpness)
const cv = $('c'), g = cv.getContext('2d'); cv.width = W * RES; cv.height = H * RES;
const AC = C.colors.accent;
function theme(r) { return Object.assign({ floor: C.colors.floor, wall: C.colors.wall, a: AC }, C.themes && C.themes[r.section]); }

const rooms = C.rooms.map((r, i) => {
  const row = Math.floor(i / 3);
  if (r.contact) r.lines = ["✉  " + C.email, "☎  " + C.phone].concat(C.links.map(l => "►  " + l.label + ": " + l.url.replace(/^https?:\/\/(www\.)?[^/]+/, "").replace(/\/$/, "")));
  return Object.assign({}, r, { i, row, col: row % 2 ? 2 - i % 3 : i % 3 });
});
const DIRS = { R: [1, 0], L: [-1, 0], D: [0, 1], U: [0, -1] }, DC = { R: [W, H / 2], L: [0, H / 2], U: [W / 2, 0], D: [W / 2, H] };
rooms.forEach(r => { r.ex = {}; [r.i - 1, r.i + 1].forEach(j => { const n = rooms[j]; if (!n) return;
  for (const k in DIRS) if (DIRS[k][0] == n.col - r.col && DIRS[k][1] == n.row - r.row) r.ex[k] = j; }); });

let cur = 0, P, E = [], EB = [], PB = [], FX = [], T = [], shake = 0, squashed = 0, maxV = 0, time = 0, started = false, ended = false, paused = true, entry = [W / 2, H / 2], deaths = 0, hits = 0, runT = 0, finale = null, peck = null, AO = [];
const keys = {}, mouse = { x: 0, y: 0, down: false }; let st = null, mute = !C.sound, ac = null;
const touch = matchMedia('(pointer:coarse)').matches;
const auto = C.autoAim == 'always' || (C.autoAim == 'touch' && touch);

function resetRooms() { rooms.forEach(r => { r.cleared = !(r.enemies && r.enemies.length); r.revealed = false; r.t = 0; r.lay = null; r.opened = false; }); }
function newPlayer() { P = { x: W / 2, y: H / 2, vx: 0, vy: 0, hp: C.hearts, inv: 0, cd: 0, dance: 0, beat: 0, sing: 0, dir: 2, safe: 0 }; }
function mk(t, x, y) { const d = { bug: [4, 13], spitter: [5, 14], sleeper: [5, 15], brute: [10, 25], boss: [C.bossHp || 70, 38] }[t] || [4, 13];
  return { t, x, y, hp: d[0], mhp: d[0], r: d[1], cd: 1 + Math.random() * 2, born: .9, fl: 0, ph: Math.random() * 6, sc: 5, face: Math.random() < .5 ? -1 : 1, sd: Math.random() * 6 }; }
function spawn(r) { E = r.enemies.map(t => { let x, y; do { x = WL + 40 + Math.random() * (W - 2 * WL - 80); y = WL + 40 + Math.random() * (H - 2 * WL - 80); } while (Math.hypot(x - P.x, y - P.y) < 230); return mk(t, x, y); }); }
function enter(i, from) {
  peck = null; cur = i; maxV = Math.max(maxV, i); const r = rooms[i]; E = []; EB = []; PB = []; AO = [];
  const sp = { R: [WL + 34, H / 2], L: [W - WL - 34, H / 2], D: [W / 2, WL + 34], U: [W / 2, H - WL - 34] };
  entry = sp[from] || [W / 2, H / 2]; P.x = entry[0]; P.y = entry[1]; P.vx = P.vy = 0; P.inv = 1;
  if (!r.cleared) spawn(r); else if (!r.revealed) reveal(r);
}
function reveal(r) {
  const fight = r.enemies && r.enemies.length; r.cleared = true; r.revealed = true; r.t = 0;
  if (fight && P.hp < C.hearts) P.hp++;
  [523, 659, 784, 1047].forEach((f, k) => setTimeout(() => sfx(f, .12, 'triangle', .06), k * 90));
  if (r.contact) finale = { t: 0, go: false, p: 0 };
}
const PECK_T = 1.5, SHOT = 520, PBOT = H - WL - 27;   // PBOT: lowest the player can stand, so the feet stay inside the room
const pStand = k => ({ R: [W - WL - PR - 8, H / 2], L: [WL + PR + 8, H / 2], U: [W / 2, WL + PR + 8], D: [W / 2, PBOT - 4] })[k];
const pFace = k => ({ R: [W - WL, H / 2], L: [WL, H / 2], U: [W / 2, WL], D: [W / 2, H - WL] })[k];
function startPeck(k, j) { peck = { k, j, t: 0, n: 0, done: false }; P.vx = P.vy = 0; P.dir = dirOf(DIRS[k][0], DIRS[k][1]); }
function updatePeck(dt, r) {   // the woodpecker hammers the door until it opens, then walks through
  if (peck.ao) return updatePeckAO(dt);
  peck.t += dt; const [tx, ty] = pStand(peck.k), q = Math.min(1, dt * 10); P.x += (tx - P.x) * q; P.y += (ty - P.y) * q;
  const n = Math.floor((peck.t * 16 + Math.PI / 2) / Math.PI), [cx, cy] = pFace(peck.k);
  if (!peck.done && n > peck.n) { peck.n = n; sfx(180 + Math.random() * 60, .05, 'square', .06, -80); sfx(90, .06, 'triangle', .05); burst(cx, cy, '#a9744a', 5); }
  if (!peck.done && peck.t >= PECK_T) { peck.done = true; r.opened = true; sfx(300, .25, 'sawtooth', .06, -150); burst(cx, cy, '#c9955f', 28); }
  if (peck.t >= PECK_T + .55) { const k = peck.k, j = peck.j; peck = null; enter(j, k); }
}
function leadAim(e) {   // aim where a moving enemy will be when the note arrives, measured from the beak where notes leave
  const d0 = dirOf(e.x - P.x, e.y - P.y), ox = P.x + BK[d0][0], oy = P.y + BK[d0][1], vx = e.vx || 0, vy = e.vy || 0; let tx = e.x, ty = e.y;
  for (let i = 0; i < 4; i++) { const t = Math.hypot(tx - ox, ty - oy) / SHOT; tx = clamp(e.x + vx * t, WL + e.r, W - WL - e.r); ty = clamp(e.y + vy * t, WL + e.r, H - WL - e.r); }
  return { x: tx, y: ty };
}
const PECK_AO_T = .6, PECK_AO_SAFE = .5;   // acorn peck duration, and extra invulnerability after it ends
const vulnerable = () => P.inv <= 0 && P.safe <= 0 && !peck;
function hurt() { if (peck || P.safe > 0) return;   // immune while pecking a door or an acorn, and briefly after an acorn peck
  hits++; P.hp--; P.inv = 1; shake = 8; sfx(140, .25, 'sawtooth', .07, -80); if (P.hp <= 0) die(); }
function die() { deaths++; toast('Respawned: room reset, try again!'); P.hp = C.hearts; P.x = entry[0]; P.y = entry[1]; P.inv = 1.5; EB = []; PB = []; AO = []; if (peck && peck.ao) peck = null; spawn(rooms[cur]); }
function burst(x, y, c, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 180; FX.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .5, c }); } }
function jingle() { [[523, 0], [659, 120], [784, 240], [1047, 360], [784, 540], [1047, 660], [1319, 780], [1047, 960], [1319, 1080], [1568, 1200], [1319, 1440], [1568, 1560], [2093, 1700]]
  .forEach(([f, ms]) => setTimeout(() => { sfx(f, .2, 'square', .045); sfx(f / 2, .2, 'triangle', .05); P.sing = .22; note(); }, ms)); }
function getRank() { const pen = hits + deaths * 4, t = C.rating || { S: 4, A: 9, B: 15, C: 22, D: 30 }; for (const q of ['S', 'A', 'B', 'C', 'D']) if (pen <= t[q]) return q; return 'F'; }
function finaleGo() { finale.go = true; finale.rank = getRank(); finale.st = { deaths, hits, squashed, time: runT }; P.dance = 8; P.beat = 0; jingle(); burst(W / 2, H / 2, AC, 70); $('btnReplay').style.display = ''; }
function wake(e) { e.awake = true; e.alert = .9; sfx(170, .25, 'sawtooth', .07, 140); burst(e.x, e.y, '#ff5a3a', 14); }
function shootE(x, y, dx, dy, k = 'goo') { EB.push({ x, y, vx: dx * 200, vy: dy * 200, k }); sfx(300, .08, 'sine', .03, -100); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hitEnemy(e, dmg, bx, by) { e.hp -= dmg; e.fl = .1; if (e.t == 'sleeper' && !e.awake) wake(e); sfx(220, .05, 'square', .03); burst(bx, by, '#fff', 3);
  if (e.hp <= 0) { E.splice(E.indexOf(e), 1); squashed++; burst(e.x, e.y, '#7be07b', e.t == 'boss' ? 50 : 12); T.push({ x: e.x, y: e.y, life: 1 }); sfx(440, .15, 'triangle', .06, 300);
    if (e.t == 'brute') { sfx(90, .35, 'sawtooth', .09, -40); shake = 10; burst(e.x, e.y, '#ffb347', 30); for (let q = 0; q < 12; q++) shootE(e.x, e.y, Math.cos(q / 12 * 6.283 + .26), Math.sin(q / 12 * 6.283 + .26), 'ember'); }
    if (e.t == 'boss') { shake = 16; E.forEach(o => { squashed++; burst(o.x, o.y, '#7be07b', 14); T.push({ x: o.x, y: o.y, life: 1 }); }); E = []; EB = []; AO = []; if (peck && peck.ao) peck = null; } } }

// ---- boss attacks: charge (telegraphed) and acorn toss (bounces, slows, can be pecked back)
function startCharge(e) { e.mode = 'wind'; e.mt = 0; e.cx = 1; e.cy = 0; sfx(120, .6, 'sawtooth', .07, 280); }
function throwAcorn(e, ux, uy) { const x = clamp(e.x + ux * e.r, WL + 16, W - WL - 16), y = clamp(e.y + uy * e.r, WL + 16, H - WL - 16);
  AO.push({ x, y, vx: ux * 205, vy: uy * 205, r: 16, state: 'fly', hurts: true, back: false, bt: 0, t: 0, wob: 0 }); e.fl = .15; sfx(200, .3, 'triangle', .08, 120); burst(x, y, '#d9a055', 10); }
function pickAttack(e) {   // weighted random attack; never the same one 3 times in a row
  const w = AO.length ? { ring: .5, charge: .5 } : { ring: .45, acorn: .25, charge: .3 };   // only one acorn out at a time
  if (e.rep >= 2) delete w[e.last];

  if (e.mode == 'idle') {

    if (e.sc <= 0 && E.length < 5) { e.sc = 5; E.push(mk('bug', e.x, e.y)); }

      else if (atk == 'acorn') { throwAcorn(e, ux, uy); e.at = 1.8; }
      else startCharge(e); }
  } else if (e.mode == 'wind') {   // telegraph: tracks you, then locks on for the last third
    e.mt += dt; if (e.mt < .75) { e.cx = ux; e.cy = uy; }

  g.save(); g.shadowColor = '#000'; g.shadowBlur = 6; g.fillStyle = th.a; g.font = 'bold 30px ' + SANS; g.fillText(r.section.toUpperCase(), W / 2, WL + 46); g.fillRect(W / 2 - 40, WL + 56, 80, 3); g.restore();
  if (r.cleared) { if (!r.lay) layout(r, th); const L = r.lay; g.save(); g.textAlign = 'left'; g.globalAlpha = Math.min(1, r.t / 1.1); g.shadowColor = '#000'; g.shadowBlur = 4;
    g.translate(W / 2, 290); g.scale(L.s, L.s); g.translate(-W / 2, -290); const top = 290 - L.y / 2 - 4;
    L.ops.forEach(o => { g.font = o[0]; g.fillStyle = o[1]; g.fillText(o[2], o[3], top + o[4]); }); g.restore(); }
  else { g.fillStyle = 'rgba(243,233,210,.25)'; g.font = 'bold 40px ' + MONO; g.fillText('? ? ?', W / 2, 290); g.font = '15px ' + MONO; g.fillText('Squash the bugs to reveal this section', W / 2, 324); }
  if (r.contact && finale && finale.go) drawRank(th);
  g.textAlign = 'center';
  AO.forEach(drawAcorn);
  E.forEach(drawEnemy);
  g.textBaseline = 'middle'; PB.forEach(b => { const c = noteSpr(0, '#ffe066'); drawSpr(c, b.x, b.y, c.width / 2, c.height / 2, 1, 2); });
  EB.forEach(b => { const c = projSpr(b.k, Math.floor(time * 8 + b.x * .05) % 2); drawSpr(c, b.x, b.y, c.width / 2, c.height / 2, 1, 2); });
  if (!(P.inv > 0 && Math.floor(time * 12) % 2)) {   // woodpecker (faces the way it shoots)
    const dn = P.dance > 0, mv = Math.hypot(P.vx, P.vy) > 40, d = dn ? 2 : P.dir;
    const wing = dn ? (Math.floor(time * 10) % 2 ? 2 : 0) : P.sing > 0 ? 1 : 0, beak = P.sing > 0 ? 1 : 0, eye = dn ? 2 : (time % 3.4 < .12 ? 1 : 0);
    const hop = dn ? Math.abs(Math.sin(time * 8)) * 9 : mv ? Math.abs(Math.sin(time * 14)) * 2.5 : Math.sin(time * 3) * 1, pk = peck && !peck.done ? Math.abs(Math.sin(peck.t * 16)) * 7 : 0, tilt = dn ? Math.sin(time * 5) * .13 : pk ? DV[d][0] * .02 * pk : 0;
    const step = (mv || dn) ? (DKIND[d] == 'E' ? Math.floor(time * 12) % 2 : (hop > 1.2 ? 1 : 0)) : 0;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(P.x, P.y + 26, 15 - hop * .4, 5, 0, 0, 7); g.fill();
    g.save(); g.translate(P.x + DV[d][0] * pk * .7, P.y - hop + DV[d][1] * pk * .7); g.rotate(tilt); drawSpr(birdSpr(DKIND[d], step, wing, beak, eye), 0, 0, 10, 11, DFLIP[d], 3); g.restore();
  }
  FX.forEach(f => { g.globalAlpha = Math.min(1, f.life * 2); g.fillStyle = f.c; g.fillRect(f.x - 2, f.y - 2, 4, 4); }); g.globalAlpha = 1;
  T.forEach(t => { g.globalAlpha = Math.min(1, t.life); if (t.nk != null) { const c = noteSpr(t.nk, t.c); drawSpr(c, t.x, t.y, c.width / 2, c.height / 2, 1, 3); } else { g.font = 'bold 18px ' + MONO; g.fillStyle = t.c || '#9dff9d'; g.fillText(t.txt || 'squashed ✔', t.x, t.y - 20); } }); g.globalAlpha = 1;
  // HUD
  for (let i = 0; i < C.hearts; i++) drawSpr(heartSpr(i < P.hp), 16 + i * 26 + 12, 22, 4.5, 4, 1, 3);
  g.textAlign = 'center'; g.font = 'bold 13px ' + MONO; g.fillStyle = C.colors.text; g.fillText('ROOM ' + (cur + 1) + ' / ' + rooms.length, W / 2, 25);
  g.textAlign = 'right'; g.fillText('BUGS SQUASHED: ' + squashed, W - 16, 25);
  const M = mapGeo();
  g.fillStyle = '#0e0914'; g.fillRect(M.x, M.y, M.w, M.h); g.strokeStyle = '#5d4d70'; g.lineWidth = 2; g.strokeRect(M.x, M.y, M.w, M.h);
  M.cells.forEach(c => { const q = c.q; g.fillStyle = q.revealed ? theme(q).a : '#4a3d58'; g.fillRect(c.x + 2 * M.ms, c.y + 2 * M.ms, 24 * M.ms, 12 * M.ms);
    if (q.i == cur) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(c.x, c.y, 28 * M.ms, 16 * M.ms); } });
  if (r.contact && !touch) { const pu = .5 + .5 * Math.sin(time * 4); g.save(); g.shadowColor = th.a; g.shadowBlur = 8 + 12 * pu; g.strokeStyle = th.a; g.lineWidth = 3; g.globalAlpha = .5 + .5 * pu; g.strokeRect(M.x - 4, M.y - 4, M.w + 8, M.h + 8); g.restore();
    g.save(); g.fillStyle = th.a; g.font = 'bold ' + (M.ms > 1 ? 22 : 14) + 'px ' + MONO; g.textAlign = 'right'; g.textBaseline = 'middle'; g.globalAlpha = .6 + .4 * pu; g.fillText('View other rooms', M.x + M.w, M.y + M.h + (M.ms > 1 ? 24 : 18)); g.restore(); }
  const bs = E.find(e => e.t == 'boss'); if (bs) { g.fillStyle = '#000'; g.fillRect(W / 2 - 150, H - 26, 300, 14); g.fillStyle = '#d65a5a'; g.fillRect(W / 2 - 148, H - 24, 296 * Math.max(0, bs.hp) / bs.mhp, 10);
    g.fillStyle = C.colors.text; g.font = 'bold 11px ' + MONO; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText('WALKTHROUGH BLOCKER BUG', W / 2, H - 32); }
  g.restore();
}

/* ---------- audio, UI, input ---------- */
function sfx(f, d = .08, type = 'square', v = .05, slide = 0) { if (mute || !ac) return; try { const t = ac.currentTime, o = ac.createOscillator(), n = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d); n.gain.setValueAtTime(v, t); n.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(n).connect(ac.destination); o.start(); o.stop(t + d); } catch (e) {} }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('on'), 2600); }
function setPaused() { paused = $('menu').classList.contains('on') || $('cvp').classList.contains('on'); }
function showMenu(end) { ended = !!end; $('mTitle').textContent = end ? '🏆 Dungeon cleared!' : C.menuTitle; $('mIntro').style.display = end ? 'none' : ''; $('mEnd').style.display = end ? '' : 'none';
  $('mRole').textContent = 'Thanks for playing. Let’s talk!'; $('mTag').textContent = C.email + ' · ' + C.phone;
  $('btnPlay').textContent = end ? '↻ Replay' : (started ? '▶ Resume' : '▶ Play'); $('menu').classList.add('on'); setPaused(); }
function start() { if (!ac && window.AudioContext) { try { ac = new AudioContext(); } catch (e) {} }
  if (!started || ended) { resetRooms(); squashed = 0; maxV = 0; deaths = hits = runT = 0; finale = null; peck = null; AO = []; T = []; FX = []; $('btnReplay').style.display = 'none'; newPlayer(); started = true; ended = false; enter(0); }
  $('menu').classList.remove('on'); setPaused(); fit(); }
function openCV() { $('cvp').classList.add('on'); setPaused(); }
$('cvbody').innerHTML = `<h2>${C.name}</h2><p>${C.role}</p><p><a href="mailto:${C.email}">${C.email}</a> · ${C.phone}<br>${C.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join(' · ')}</p>` +
  rooms.filter(r => r.cv !== false).map(r => `<section><h3>${r.section.toUpperCase()}</h3><h4>${r.title}${r.meta ? `<small>${r.meta}</small>` : ''}</h4><ul>${r.lines.map(l => typeof l == 'string' ? `<li>${l}</li>`
    : `<li>${l.text}<ul>${(l.sub || []).map(s => `<li>${s}</li>`).join('')}</ul></li>`).join('')}</ul></section>`).join('');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
$('mTitle').textContent = C.menuTitle; $('fileLabel').textContent = '🕹️ ' + C.fileLabel;
$('mIntro').innerHTML = C.menuIntro.map(l => l ? '<p>' + esc(l).split('*').map((s, i) => i % 2 ? '<span class="hl">' + s + '</span>' : s).join('') + '</p>' : '<div class="gap"></div>').join('');
$('btnReplay').onclick = () => { ended = true; start(); }; $('btnPlay').onclick = start; $('btnSkip').onclick = openCV; $('btnCV').onclick = openCV;
$('btnClose').onclick = () => { $('cvp').classList.remove('on'); setPaused(); };
$('btnMute').onclick = () => { mute = !mute; $('btnMute').textContent = mute ? '🔇' : '🔊'; }; $('btnMute').textContent = mute ? '🔇' : '🔊';
addEventListener('keydown', e => { if (e.code.startsWith('Arrow') || e.code == 'Space') e.preventDefault(); keys[e.code] = true;
  if ((e.code == 'Enter' || e.code == 'Space') && $('menu').classList.contains('on') && !$('cvp').classList.contains('on')) start();
  if (e.code == 'Escape') { if ($('cvp').classList.contains('on')) $('btnClose').onclick(); else if (started) showMenu(false); } });
addEventListener('keyup', e => keys[e.code] = false); addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const mpos = e => { const b = cv.getBoundingClientRect(); mouse.x = (e.clientX - b.left) * W / b.width; mouse.y = (e.clientY - b.top) * H / b.height; };
cv.addEventListener('mousedown', e => { const h = mapHit(e.clientX, e.clientY); if (h >= 0) { goRoom(h); return; } mouse.down = true; mpos(e); }); addEventListener('mouseup', () => mouse.down = false);
cv.addEventListener('mousemove', e => { mpos(e); cv.style.cursor = mapHit(e.clientX, e.clientY) >= 0 ? 'pointer' : ''; });
const stage = $('stage'), stk = $('stick');
stage.addEventListener('touchstart', e => { const t0 = e.changedTouches[0], hh = mapHit(t0.clientX, t0.clientY); if (hh >= 0) { goRoom(hh); e.preventDefault(); return; } if (st) return; const t = e.changedTouches[0]; st = { id: t.identifier, x: t.clientX, y: t.clientY, dx: 0, dy: 0 };
  stk.style.cssText = `display:block;left:${t.clientX}px;top:${t.clientY}px`; e.preventDefault(); }, { passive: false });
stage.addEventListener('touchmove', e => { if (!st) return; for (const t of e.changedTouches) if (t.identifier == st.id) { let dx = t.clientX - st.x, dy = t.clientY - st.y; const l = Math.hypot(dx, dy), m = Math.min(l, 50) / (l || 1);
  dx *= m; dy *= m; st.dx = dx / 50; st.dy = dy / 50; stk.firstChild.style.transform = `translate(${dx}px,${dy}px)`; } e.preventDefault(); }, { passive: false });
const tend = e => { if (st) for (const t of e.changedTouches) if (t.identifier == st.id) { st = null; stk.style.display = 'none'; stk.firstChild.style.transform = ''; } };
stage.addEventListener('touchend', tend); stage.addEventListener('touchcancel', tend);
function fit() { const k = Math.min(stage.clientWidth / W, stage.clientHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
addEventListener('resize', fit); fit();
let last = 0; function loop(t) { requestAnimationFrame(loop); const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; if (started) { if (!paused) { time += dt; update(dt); } draw(); } }
requestAnimationFrame(loop);
</script>
